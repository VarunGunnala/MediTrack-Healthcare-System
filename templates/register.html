{% extends 'base.html' %}

{% block content %}
<div class="auth-box">
  <h2 class="auth-header">Patient Registration</h2>
  <form method="POST">
    <div class="form-group">
      <label>Full Legal Name</label>
      <input type="text" name="full_name" required placeholder="e.g. John Doe">
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" required placeholder="john@example.com">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="••••••••">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" required placeholder="28" min="1" max="120">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" name="phone" required placeholder="9876543210">
    </div>

    <div class="form-group">
      <label>Residential Address</label>
      <textarea name="address" rows="3" required placeholder="Enter complete address"></textarea>
    </div>

    <button type="submit" class="btn-submit">Complete Registration</button>
  </form>
</div>
{% endblock %}
